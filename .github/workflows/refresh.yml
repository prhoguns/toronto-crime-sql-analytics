name: Refresh dashboard
# Re-downloads the City's data every week and rebuilds the live dashboard (docs/, served by Pages).
# results/ and FINDINGS.md stay on their dated snapshot so the written analysis matches its tables.
on:
  schedule:
    - cron: "17 11 * * 1"  # Mondays, 06:17/07:17 Toronto time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements.txt
      - name: Download the current data and rebuild
        run: |
          python scripts/download.py
          python scripts/build_db.py
          python scripts/build_dashboard.py
      - name: Commit if the dashboard changed
        run: |
          if git diff --quiet -- docs/; then
            echo "No change in the source data."
            exit 0
          fi
          latest=$(grep -o 'latest report [0-9-]*' docs/index.html | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Refresh dashboard (${latest})"
          git push
